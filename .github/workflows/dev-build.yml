name: SuperChant Dev build

# Every push to dev refreshes SuperChant-Dev.apk (com.superchant.dev, installs beside the Play app) on one private
# draft release, so the owner can install the latest dev build from github.com/Dhruv2mars/superchant/releases
# on their phone (signed in to GitHub; a draft's own URL changes on every edit, the Releases page doesn't).
# Drafts are only visible to repo collaborators; nothing is published.
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: dev-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The maintainer's Mac debug key, so CI and local `installDebug` builds update each other on the phone.
      - name: Debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
      - run: ./gradlew assembleDebug
      - name: "Guard - signed with the Mac debug key"
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | grep -q 62c1085c4052d6ed2ab3b9b78e2b604df1fec36177cb726580f492d560a355f1 \
            || { echo "::error::Not signed with the Mac debug key; it would not update the phone's SuperChant Dev"; exit 1; }
      - name: Update the private draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: dev-latest
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SuperChant-Dev.apk
          notes="Latest dev build ($(git log -1 --pretty='%h %s'))."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" SuperChant-Dev.apk --clobber
            gh release edit "$TAG" --draft --notes "$notes"
          else
            gh release create "$TAG" SuperChant-Dev.apk --draft --title "SuperChant Dev (latest dev build)" --notes "$notes"
          fi
          echo "Install from https://github.com/${{ github.repository }}/releases (draft at the top)" >> "$GITHUB_STEP_SUMMARY"
