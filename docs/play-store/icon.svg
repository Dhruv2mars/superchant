<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <!-- Background -->
  <rect width="108" height="108" fill="#C4956A"/>
  
  <!-- Icon group - scaled and centered -->
  <g transform="translate(32.4, 32.4) scale(0.4)">
    <!-- Outer ring -->
    <circle cx="54" cy="54" r="54" fill="#D4A574"/>
    <!-- Inner light circle -->
    <circle cx="54" cy="54" r="46" fill="#F5E6D3"/>
    <!-- Progress ring outline -->
    <circle cx="54" cy="54" r="34" fill="none" stroke="#C4956A" stroke-width="3"/>
    <!-- Clock hands / counter indicator -->
    <path d="M54,30 L54,54 L72,54" fill="none" stroke="#8B6914" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Center dot -->
    <circle cx="54" cy="54" r="5" fill="#C4956A"/>
  </g>
</svg>
