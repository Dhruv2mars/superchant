name: CI

on:
  pull_request:  # dev/main pushes run the release workflows, which repeat these checks
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint, test
        run: ./gradlew assembleDebug assembleRelease lint test
      - name: "Guard - no INTERNET permission"
        run: |
          manifest=$(ls app/build/intermediates/merged_manifest/release/*/AndroidManifest.xml | head -1)
          test -f "$manifest" || { echo "::error::merged release manifest not found"; exit 1; }
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "::error::The release manifest requests INTERNET. SuperChant must stay offline."; exit 1
          fi
