buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
    classpath("org.jetbrains.kotlin:kotlin-serialization:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

group = 'com.superchant.engine'
version = '1.0.0'

// The SuperChant engine: the Kotlin app's data layer, counting service, accessibility key filter, Quick Settings
// tile, reminders and the Compose mala ring, unchanged where possible (see AGENTS.md).
android {
  namespace "com.superchant.engine"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles 'proguard-rules.pro'
  }
  buildFeatures {
    compose true
  }
  testOptions {
    // android.util.Log (used by PreferencesRepository) is a no-op in JVM unit tests
    unitTests.returnDefaultValues = true
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.18.0'
  implementation 'androidx.datastore:datastore-preferences:1.2.1'
  implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
  implementation platform('androidx.compose:compose-bom:2026.09.00')
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.compose.material:material-icons-core'
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'

  testImplementation 'junit:junit:4.13.2'
}
