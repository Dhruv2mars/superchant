# Buildkite CI.
# Runs on the free hosted linux-small queue; checkout comes from the Entire plugin Buildkite adds to every job.
steps:
  # The Android engine (expo/modules/superchant-native): its JVM tests, including the golden fixtures check that
  # the TypeScript and Swift tests replay. Runs only when something native (or the fixtures) changed, on the large
  # agent with the Gradle home kept between builds (an uncached run spends ~6 of its 7 min downloading and
  # compiling dependencies on the small agent). The release build and network guard stay on the Mac.
  - label: ":android: native module tests"
    key: native
    agents: { queue: linux-large }
    timeout_in_minutes: 30
    if_changed:
      - "expo/modules/**"
      - "expo/plugins/**"
      - "expo/app.config.ts"
      - "expo/package.json"
      - "expo/bun.lock"
      - "expo/src/core/__fixtures__/**"
      - ".buildkite/pipeline.yml"
    cache:
      name: gradle
      paths: [".gradle-home"]
      size: 20g
    plugins:
      - docker#v5.12.0:
          image: ghcr.io/cirruslabs/android-sdk:36
          environment: ["GRADLE_USER_HOME=/workdir/.gradle-home"]
    command: |
      yes | sdkmanager --licenses >/dev/null || true
      node=$$(curl -fsSL https://nodejs.org/dist/latest-v24.x/SHASUMS256.txt | grep -o 'node-v24[^ ]*-linux-x64.tar.gz' | head -1)
      curl -fsSL "https://nodejs.org/dist/latest-v24.x/$$node" | tar -xz -C /usr/local --strip-components=1
      npm install --global --silent bun@1
      cd expo
      bun install --frozen-lockfile
      bunx expo prebuild --platform android --no-install >/dev/null
      cd android
      ./gradlew --no-daemon --parallel --build-cache :superchant-native:testDebugUnitTest

  # The Expo app (expo/): types, oxlint, the pure cores against the golden fixtures in three time zones, and the
  # release script's version helper. The Swift vectors need swiftc (see AGENTS.md).
  # Node runs the Expo CLI (bunx picks node when it exists): under Bun the runtime fingerprint skips the config
  # plugins and comes out different from the store build's, so updates from here would never reach it.
  - label: ":expo: typecheck, lint, cores"
    key: expo
    agents: { queue: linux-small }
    timeout_in_minutes: 15
    plugins:
      - docker#v5.12.0:
          image: node:24-bookworm
    command: |
      [ -e /usr/share/zoneinfo/America/New_York ] || { apt-get update -qq && apt-get install -y -qq tzdata >/dev/null; }
      npm install --global --silent bun@1
      cd expo
      bun install --frozen-lockfile
      bunx tsc --noEmit
      bun run lint
      bun run test
      python3 -m unittest discover -s scripts
      for p in android ios; do echo "runtime $$p: $$(bunx expo-updates runtimeversion:resolve --platform $$p | tail -1 | sed 's/.*"runtimeVersion":"\([0-9a-f]*\)".*/\1/')"; done

  # One store build, two update channels: dev publishes to preview (the owner's install, switched to early
  # updates in Settings), main to production (everyone). An update reaches only builds with the same runtime
  # fingerprint; a native change needs a store build (expo/scripts/release-android.sh).
  - label: ":expo: publish update"
    key: publish
    if: build.branch == "dev" || build.branch == "main"
    depends_on: expo
    agents: { queue: linux-small }
    timeout_in_minutes: 20
    concurrency: 1
    concurrency_group: superchant/eas-update
    secrets: [EXPO_TOKEN]
    plugins:
      - docker#v5.12.0:
          image: node:24-bookworm
          environment: [EXPO_TOKEN, BUILDKITE_BRANCH, BUILDKITE_MESSAGE]
    command: |
      git config --global --add safe.directory '*'
      npm install --global --silent bun@1
      cd expo
      bun install --frozen-lockfile
      channel=preview; [ "$$BUILDKITE_BRANCH" = main ] && channel=production
      message=$$(printf '%s' "$$BUILDKITE_MESSAGE" | head -1 | cut -c1-200)
      # A robot may not upload fingerprint records, so each platform's fingerprint is resolved here and passed
      # in as a plain runtime string (app.config.ts), and EAS CLI's own fingerprint upload is skipped
      for p in android ios; do
        rv=$$(bunx expo-updates runtimeversion:resolve --platform $$p | tail -1 | sed 's/.*"runtimeVersion":"\([0-9a-f]*\)".*/\1/')
        [ -n "$$rv" ] || { echo "no $$p runtime version"; exit 1; }
        SUPERCHANT_RUNTIME_VERSION=$$rv EAS_SKIP_AUTO_FINGERPRINT=1 bunx eas-cli@26 update --channel "$$channel" --platform $$p \
          --environment production --non-interactive --message "$$message"
      done
