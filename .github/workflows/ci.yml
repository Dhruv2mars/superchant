name: CI

# GitHub is a one-way mirror of the Entire repo (git mirror); this runs on every mirrored push. report.yml reports
# each run to the Entire trail, whose merge gate requires it.
# A push to dev publishes an EAS Update to the preview channel, a push to main to production.
on:
  push:
    branches-ignore: [ux-evidence, 'archive/**']
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels a branch's run, except on dev and main, where that could stop a publish halfway
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Node runs the Expo CLI (bunx picks node when it exists): under Bun the runtime fingerprint skips the config
      # plugins and comes out different from the store build's
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: oxlint
        run: bun run lint
      - name: TS cores (UTC, New York, Kolkata)
        run: bun run test
      - name: Release script version helper
        run: python3 -m unittest discover -s scripts
      - name: Swift model against the golden fixtures
        run: bun run test:swift
      - name: Runtime fingerprints
        run: |
          for p in android ios; do
            echo "runtime $p: $(bunx expo-updates runtimeversion:resolve --platform $p | tail -1 | sed 's/.*"runtimeVersion":"\([0-9a-f]*\)".*/\1/')"
          done

      - name: Generate the Android project
        run: CI=1 bunx expo prebuild -p android --no-install
      - name: Engine JVM tests and release build
        working-directory: expo/android
        run: ./gradlew :superchant-native:testDebugUnitTest :app:assembleRelease -PreactNativeArchitectures=arm64-v8a
      - name: "Guard: network only for app updates"
        working-directory: expo/android
        run: ../scripts/network-guard.sh

  # One store build, two update channels: dev publishes to preview (the owner's install, switched to early updates in
  # Settings), main to production (everyone). An update reaches only builds with the same runtime fingerprint; a
  # native change needs a store build (expo/scripts/release-android.sh).
  publish:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: eas-update
      cancel-in-progress: false
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Publish the update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          channel=preview; [ "$GITHUB_REF_NAME" = main ] && channel=production
          message=$(printf '%s' "$MESSAGE" | head -1 | cut -c1-200)
          # A robot may not upload fingerprint records, so each platform's fingerprint is resolved here and passed in
          # as a plain runtime string (app.config.ts), and EAS CLI's own fingerprint upload is skipped
          for p in android ios; do
            rv=$(bunx expo-updates runtimeversion:resolve --platform $p | tail -1 | sed 's/.*"runtimeVersion":"\([0-9a-f]*\)".*/\1/')
            [ -n "$rv" ] || { echo "no $p runtime version"; exit 1; }
            SUPERCHANT_RUNTIME_VERSION=$rv EAS_SKIP_AUTO_FINGERPRINT=1 bunx eas-cli@26 update --channel "$channel" --platform $p \
              --environment production --non-interactive --message "$message"
          done
