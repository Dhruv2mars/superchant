name: Expo app

# Checks the Expo app (expo/) on every PR: types, the pure cores against the Kotlin golden fixtures (TS and
# Swift), the Android engine's JVM tests, a release build, and the network guard. The Kotlin app keeps its own
# CI (ci.yml).
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: expo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: TS cores (UTC, New York, Kolkata)
        run: bun run test
      - name: Swift model against the Kotlin vectors
        run: bun run test:swift

      - name: Generate the Android project
        run: CI=1 bunx expo prebuild -p android --no-install
      - name: Engine JVM tests and release build
        working-directory: expo/android
        run: ./gradlew :superchant-native:testDebugUnitTest :app:assembleRelease -PreactNativeArchitectures=arm64-v8a

      # Only the update hosts may be reached: INTERNET (and ACCESS_NETWORK_STATE, for expo-updates) are allowed,
      # but the release build must trust TLS for the update hosts only, allow no cleartext, and request nothing
      # beyond the Kotlin app's permissions.
      - name: "Guard - network only for app updates"
        working-directory: expo/android
        run: |
          manifest=$(ls app/build/intermediates/merged_manifest/release/*/AndroidManifest.xml | head -1)
          test -f "$manifest" || { echo "::error::merged release manifest not found"; exit 1; }
          allowed="android.permission.INTERNET android.permission.ACCESS_NETWORK_STATE android.permission.FOREGROUND_SERVICE android.permission.FOREGROUND_SERVICE_SPECIAL_USE android.permission.POST_NOTIFICATIONS android.permission.RECEIVE_BOOT_COMPLETED android.permission.VIBRATE com.superchant.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          for p in $(grep -o 'uses-permission[^>]*android:name="[^"]*"' "$manifest" | sed 's/.*android:name="//; s/"$//'); do
            case " $allowed " in *" $p "*) ;; *) echo "::error::Unexpected permission $p in the release manifest"; exit 1 ;; esac
          done
          grep -q 'android:networkSecurityConfig="@xml/network_security_config"' "$manifest" \
            || { echo "::error::release manifest has no network security config"; exit 1; }
          if grep -q 'usesCleartextTraffic="true"' "$manifest"; then echo "::error::cleartext traffic enabled"; exit 1; fi
          nsc=app/src/release/res/xml/network_security_config.xml
          hosts=$(grep -o '<domain[^>]*>[^<]*</domain>' "$nsc" | sed 's/<[^>]*>//g' | sort | tr '\n' ' ')
          test "$hosts" = "assets.eascdn.net u.expo.dev " || { echo "::error::trusted hosts are '$hosts'"; exit 1; }
          grep -q '<base-config cleartextTrafficPermitted="false">' "$nsc" && grep -A1 '<base-config' "$nsc" | grep -q '<trust-anchors />' \
            || { echo "::error::base config must trust no certificate authority"; exit 1; }
